<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0e1826">
  <title>ФІШЕР — personal control</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css?v=17">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="logo-wrap">
      <div class="logo-mark">Ф</div>
      <div>
        <div class="logo-title">ФІШЕР</div>
        <div class="logo-sub">personal control</div>
      </div>
    </div>

    <nav class="side-nav">
      <button class="nav-btn active" data-view="home"><span>⌂</span>Головна</button>
      <button class="nav-btn" data-view="week"><span>▦</span>Мій тиждень</button>
      <button class="nav-btn" data-view="classes"><span>◫</span>Заняття</button>
      <button class="nav-btn" data-view="tasks"><span>✓</span>Справи</button>
      <button class="nav-btn" data-view="projects"><span>▣</span>Проєкти</button>
      <button class="nav-btn" data-view="notes"><span>✎</span>Нотатки</button>
    </nav>

    <div class="side-divider"></div>

    <div class="sidebar-mini">
      <div class="mini-title">ШВИДКИЙ ДОСТУП</div>
      <button class="mini-link" id="exportBtn">Експорт даних</button>
      <label class="mini-link file-link">Імпорт даних<input type="file" id="importFile" accept="application/json"></label>
    </div>

    <div class="sidebar-bottom">
      <span>CONTROL v3.0</span>
      <span class="theme-dot"></span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="greeting">Добрий день, Володимире!</h1>
        <div class="today-label" id="todayLabel"></div>
      </div>
      <div class="top-actions">
        <button class="circle-btn" id="searchBtn">⌕</button>
        <button class="avatar-btn">Ф</button>
      </div>
    </header>

    <div id="searchBox" class="search-box hidden">
      <input id="searchInput" placeholder="Пошук у заняттях, справах, проєктах і нотатках…">
      <div id="searchResults"></div>
    </div>

    <section id="homeView" class="view active"></section>
    <section id="weekView" class="view"></section>
    <section id="classesView" class="view"></section>
    <section id="tasksView" class="view"></section>
    <section id="projectsView" class="view"></section>
    <section id="notesView" class="view"></section>
  </main>

  <nav class="mobile-nav">
    <button class="mobile-btn active" data-view="home"><span>⌂</span><small>Головна</small></button>
    <button class="mobile-btn" data-view="classes"><span>◫</span><small>Заняття</small></button>
    <button class="mobile-btn" data-view="tasks"><span>✓</span><small>Справи</small></button>
    <button class="mobile-btn" data-view="projects"><span>▣</span><small>Проєкти</small></button>
  </nav>

  <button class="fab" id="fab">＋</button>
</div>


<div class="day-overlay hidden" id="dayOverlay">
  <div class="day-screen">
    <div id="dayScreenContent"></div>
  </div>
</div>

<div class="modal-backdrop hidden" id="modal">
  <div class="modal-card">
    <div class="modal-top">
      <div>
        <div class="small-label">НОВИЙ ЗАПИС</div>
        <h2 id="modalTitle">Що додаємо?</h2>
      </div>
      <button class="close-btn" id="closeModal">×</button>
    </div>

    <div class="type-grid" id="typeGrid">
      <button data-type="class"><span>◫</span><b>Заняття</b><small>група, дисципліна, місце</small></button>
      <button data-type="task"><span>✓</span><b>Справа</b><small>дедлайн, пріоритет</small></button>
      <button data-type="project"><span>▣</span><b>Проєкт</b><small>прогрес, наступний крок</small></button>
      <button data-type="note"><span>✎</span><b>Нотатка</b><small>думка, ідея, посилання</small></button>
    </div>

    <form id="entryForm" class="hidden">
      <input type="hidden" id="entryType">
      <input type="hidden" id="entryId">
      <div id="formFields"></div>
      <div class="modal-actions">
        <button type="button" class="secondary-btn" id="cancelBtn">Скасувати</button>
        <button type="submit" class="gold-btn">Зберегти</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="script.js?v=17"></script>
</body>
</html>
